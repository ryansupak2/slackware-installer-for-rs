# /etc/dwm/backgrounds.conf — dwm desktop background colour, per user.
#
# One entry per line:   user=#RRGGBB
# "default" is used for any user without an entry.
#
# A user can override this at any time without touching system files:
#   dwm-background '#5a5a5a'      # writes ~/.dwm-background and applies it now
#   dwm-background                # prints the colour currently in effect
# ~/.dwm-background wins over this file.
#
# Installed by steps/suckless-dwm.sh; source: dotfiles/dwm/backgrounds.conf.

default=#808080

# root: signal red (deliberate — do not change)
root=#CC0000

# rs: medium grey
rs=#808080
