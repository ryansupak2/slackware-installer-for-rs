# Mouse cursor — theme and size in pixels. System-wide, all users, all apps.
#
# This is the ONE place the cursor size is written. steps/xcursor.sh installs
# it as /etc/xcursor.conf and generates everything that consumes it:
#   /etc/X11/xcursor-resources  -> xrdb -merge'd by dwm-start
#                                  (Xcursor.size, for libXcursor clients:
#                                   dwm, st, GTK, Chrome, Qt)
#   /etc/profile.d/xcursor.sh   -> XCURSOR_SIZE/XCURSOR_THEME for login shells
#   every user's gtk-3.0/settings.ini (gtk-cursor-theme-size/name)
#
# Why 48: the panel is 2560x1600 on 288x180 mm (~225 dpi) but X reports 96 dpi,
# so anything sized "1 px = 1/96 inch" lands at ~43% of its physical size. 48 is
# twice the 24 px freedesktop default — the "half size" that was reported —
# and it is one of Adwaita's real image sizes (24, 30, 36, 48, 72, 96), so the
# cursors are genuine 48 px artwork, not an upscale. Keep it on that list.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=48
