# /etc/chromium/ui-font.conf — UI font deltas for the locally built Chromium
#
# Read ONCE per browser process (patch 0001 in patches/chromium/, function
# chrome_ui_font::LoadDeltas in chrome/browser/ui/views/chrome_typography.cc),
# so a change needs a browser restart.
#
# Effective text size = GTK UI font + Chromium's own per-element offset + delta
#
#   element   Chromium target   offset vs the 12pt base   key
#   -------   ---------------   ----------------------    ---------------
#   URL bar   14pt              +2                        omnibox_delta
#   tab strip 12pt               0                        tab_delta
#
# Example: gtk-font-name=Berkeley Mono 12 (the installer default) plus
# omnibox_delta=0 / tab_delta=0 gives a 14pt URL bar and 12pt tabs — stock
# Chromium behaviour, and the reason the two look different out of the box.
#
# Do not hand-edit if you can avoid it: `chromium-ui-font` (installed by
# steps/chromium.sh) writes this file and understands effective point sizes.
# Values are clamped to -6..10 points. Ranges outside -2..+4 are untested
# against the fixed 34px tab strip height; bigger tabs may clip.
#
# Only the locally built Chromium reads this file. Google Chrome (/usr/local/
# bin/chrome) is a prebuilt binary and ignores it entirely.

omnibox_delta=0
tab_delta=0
