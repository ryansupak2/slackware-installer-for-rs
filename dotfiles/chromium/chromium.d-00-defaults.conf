# /etc/chromium.d/00-defaults.conf — sourced (POSIX sh) by /usr/bin/chromium,
# Debian-style. Every *.conf in this directory is read in name order before the
# browser starts, so this is the place for launch flags and for pointing the
# UI font overrides at a different file.
#
# Canonical source: dotfiles/chromium/chromium.d-00-defaults.conf, installed by
# steps/chromium.sh. Edit the repo copy, not this one.

# Screen/page scale. 2 matches the 200% that w / wk get from
# /usr/local/bin/chrome (--force-device-scale-factor=2), so both browsers
# render pages at the same size and the zoom control still reads 100%.
# Set CHROMIUM_UI_SCALE=1.0 for true 100% pages when you want to see exactly
# what a chromium-ui-font delta does (DSF multiplies those deltas too).
#
# --no-sandbox (root) and --password-store (no D-Bus secret service) are
# already applied by the wrapper itself; this variable is for extras like
# this one.
CHROMIUM_FLAGS="${CHROMIUM_FLAGS:-} --force-device-scale-factor=${CHROMIUM_UI_SCALE:-2}"

# UI font overrides for the patched build (see dotfiles/chromium/ui-font.conf).
export CHROMIUM_UI_FONT_CONF="${CHROMIUM_UI_FONT_CONF:-/etc/chromium/ui-font.conf}"
