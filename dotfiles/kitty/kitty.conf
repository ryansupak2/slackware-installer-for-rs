# /etc/xdg/kitty/kitty.conf — system-wide kitty defaults for EVERY user.
#
# Deployed by steps/kitty.sh from dotfiles/kitty/kitty.conf. Edit the repo copy
# and re-run the step; do not edit /etc/xdg/kitty/kitty.conf by hand.
#
# kitty merges this file (kitty/cli.py: SYSTEM_CONF) *before* any user config,
# so ~/.config/kitty/kitty.conf still wins. One file therefore serves root and
# every human user without per-user dotfiles.
#
# st IS STILL THE DEFAULT TERMINAL ON THIS MACHINE. dwm's Mod+Enter and
# Ctrl+Shift+T spawn `st` (dotfiles/suckless/dwm/config.h: termcmd), no alias
# is redirected, and nothing here changes that. kitty is the extra, GPU
# rendered terminal you start by name: `kitty`.

# ── Look: same fonts and colours as st ────────────────────────────────
# st is Berkeley Mono:pixelsize=32 (dotfiles/suckless/st/config.h). kitty
# sizes in points and X reports 96 dpi, so 24 pt renders at 32 px. Bold and
# italic come from the same family (Berkeley Mono has Bold/Oblique faces).
font_family            Berkeley Mono
font_size              24.0

# st's palette (dotfiles/suckless/st/config.h colorname[]/defaultfg/bg), so
# the two terminals are indistinguishable side by side.
background             #000000
foreground             #e5e5e5
cursor                 #cccccc
color0                 #000000
color1                 #cd0000
color2                 #00cd00
color3                 #cdcd00
color4                 #0000ee
color5                 #cd00cd
color6                 #00cdcd
color7                 #e5e5e5
color8                 #7f7f7f
color9                 #ff0000
color10                #00ff00
color11                #ffff00
color12                #5c5cff
color13                #ff00ff
color14                #00ffff
color15                #ffffff

# ── Session behaviour ─────────────────────────────────────────────────
# This machine runs X (xlibre) with dwm; there is no Wayland compositor, so
# do not leave the display backend to autodetection.
linux_display_server   x11

# st draws no padding, dwm has a 1 px border, and Mod+Shift+Z kills windows
# without asking — match that: no padding, no close confirmation, no bell.
window_padding_width   0
confirm_os_window_close 0
enable_audio_bell      no

# Same 10k-line scrollback everywhere (kitty's default, pinned so an upgrade
# cannot change it silently).
scrollback_lines       10000

# Clipboard keys already match st (kitty defaults): Ctrl+Shift+C copies the
# selection to CLIPBOARD, Ctrl+Shift+V pastes CLIPBOARD, Shift+Insert pastes
# PRIMARY. Both terminals share autocutsel (clipboard-ensure), so a copy in
# one pastes in the other.
